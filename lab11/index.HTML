<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная работа №11 — Вариант 1 (Улучшенный)</title>
  <!-- Подключаем React и Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; padding: 30px; margin: 0;">

  <div id="root"></div>

  <script type="text/babel">
    // Дочерний компонент LikeButton
    function LikeButton({ label, onLikeChange }) {
      const [likes, setLikes] = React.useState(0);

      const handleLike = () => {
        const newLikes = likes + 1;
        setLikes(newLikes);
        if (onLikeChange) onLikeChange(1); // Передаем событие наверх родителю
      };

      const handleReset = () => {
        if (likes > 0) {
          if (onLikeChange) onLikeChange(-likes);
          setLikes(0);
        }
      };

      return (
        <div style={{ 
          background: '#ffffff', 
          border: '1px solid #e0e0e0', 
          padding: '20px', 
          borderRadius: '12px', 
          width: '260px', 
          boxShadow: '0 4px 6px rgba(0,0,0,0.05)',
          transition: 'transform 0.2s ease',
        }}>
          <h4 style={{ margin: '0 0 10px 0', color: '#1a73e8', fontSize: '18px' }}>{label}</h4>
          <p style={{ fontSize: '16px', margin: '0 0 15px 0' }}>
            Лайков: <strong style={{ color: '#2e7d32', fontSize: '18px' }}>{likes}</strong>
          </p>
          <div style={{ display: 'flex', gap: '10px' }}>
            <button 
              onClick={handleLike}
              style={{ 
                background: '#1a73e8', color: 'white', border: 'none', 
                padding: '8px 14px', borderRadius: '6px', cursor: 'pointer',
                fontWeight: 'bold', flex: 1
              }}
            >
              👍 Лайк
            </button>
            <button 
              onClick={handleReset}
              style={{ 
                background: '#f1f3f4', color: '#5f6368', border: '1px solid #dadce0', 
                padding: '8px 12px', borderRadius: '6px', cursor: 'pointer',
                flex: 1
              }}
            >
              Сброс
            </button>
          </div>
        </div>
      );
    }

    // Главный родительский компонент App
    function App() {
      const [totalGlobalLikes, setTotalGlobalLikes] = React.useState(0);

      const handleGlobalLikeChange = (delta) => {
        setTotalGlobalLikes(prev => prev + delta);
      };

      return (
        <div style={{ maxWidth: '600px', margin: '0 auto' }}>
          <div style={{ borderBottom: '2px solid #1a73e8', paddingBottom: '15px', marginBottom: '20px' }}>
            <h2 style={{ margin: '0 0 10px 0', color: '#202124' }}>Лабораторная работа №11 — Вариант 1</h2>
            <p style={{ margin: 0, color: '#5f6368', lineHeight: '1.5' }}>
              Компонент <strong>LikeButton</strong> получает подпись через <code>props</code>, а число лайков хранит в собственном <code>state</code>.
            </p>
          </div>

          {/* Информационная панель родителя */}
          <div style={{ 
            background: '#e8f0fe', borderLeft: '4px solid #1a73e8', 
            padding: '15px 20px', borderRadius: '0 8px 8px 0', marginBottom: '25px',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center'
          }}>
            <div>
              <span style={{ display: 'block', fontSize: '13px', color: '#5f6368', textTransform: 'uppercase', fontWeight: 'bold' }}>Статистика родителя</span>
              <span style={{ fontSize: '18px', color: '#1a73e8', fontWeight: 'bold' }}>Всего лайков на странице: {totalGlobalLikes}</span>
            </div>
          </div>

          {/* Контейнер с дочерними компонентами */}
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '20px' }}>
            <LikeButton label="Статья про React" onLikeChange={handleGlobalLikeChange} />
            <LikeButton label="Видеоурок по JS" onLikeChange={handleGlobalLikeChange} />
            <LikeButton label="Лекция по Базам Данных" onLikeChange={handleGlobalLikeChange} />
          </div>
        </div>
      );
    }

    // Рендеринг в DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
